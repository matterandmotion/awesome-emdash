name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  awesome-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # awesome-lint reads the full git history to check the list's age
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run awesome-lint
        run: npx --yes awesome-lint@2.3.0
        env:
          # Lets awesome-lint check the repo description, topics, and license without hitting rate limits
          github_token: ${{ secrets.GITHUB_TOKEN }}
